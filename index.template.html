<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rain Performance · Kyiv</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c2129;
    --line: #2a313c;
    --text: #e6edf3;
    --muted: #8b96a3;
    --accent: #4f9dff;
    --accent-2: #7ee787;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter",
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    padding: 28px 32px 72px;
    max-width: 1200px;
  }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em; }
  h2 { font-size: 18px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; max-width: 820px; }
  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }
  .meta {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .meta .label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .meta .value { font-size: 18px; font-weight: 600; margin-top: 4px; }
  .meta .value.sm { font-size: 14px; }
  .section-title {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 12px;
  }
  .cohorts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 14px;
  }
  .cohort {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .cohort.campaign { border-color: var(--accent-2); }
  .cohort-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .cohort h3 {
    font-size: 16px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .count {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .desc { color: var(--muted); font-size: 13px; margin: 0; }
  .metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .metric {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .metric .k {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .metric .v { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .windows {
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }
  .windows strong { color: var(--text); font-weight: 600; }
  .actions { margin-top: auto; padding-top: 4px; }
  .btn {
    appearance: none;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s, color 0.15s;
  }
  .btn:hover { background: var(--accent); color: #0b1117; }
  .btn:active { opacity: 0.85; }
  .footnote {
    margin-top: 20px;
    color: var(--muted);
    font-size: 12px;
    max-width: 820px;
  }
  .collapse-block {
    margin-top: 40px;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .collapse-block summary {
    cursor: pointer;
    padding: 14px 18px;
    background: var(--panel);
    font-size: 14px;
    font-weight: 600;
    list-style: none;
    user-select: none;
  }
  .collapse-block summary::-webkit-details-marker { display: none; }
  .collapse-block summary::after {
    content: "Show";
    float: right;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
  }
  .collapse-block[open] summary::after { content: "Hide"; }
  .collapse-body { padding: 20px 18px 8px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
  <h1>Rain Performance · Kyiv</h1>

  <h2>Sunday · 5 storm campaigns</h2>
  <p class="sub" id="campaign-subtitle"></p>
  <div class="meta-grid" id="campaign-meta-grid"></div>
  <p class="section-title">Time slots (staggered activation)</p>
  <div class="cohorts" id="campaign-cohorts"></div>
  <p class="footnote" id="campaign-footnote"></p>

  <details class="collapse-block" id="weekend-section">
    <summary>Weekend work pattern cohorts</summary>
    <div class="collapse-body">
      <p class="sub" id="subtitle"></p>
      <div class="meta-grid" id="meta-grid"></div>
      <p class="section-title">Cohorts by weekend activity pattern</p>
      <div class="cohorts" id="cohorts"></div>
      <p class="footnote" id="footnote"></p>
    </div>
  </details>

<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("report-data").textContent);
const { meta, cohorts, cohort_order, sunday_campaigns: SC } = DATA;

function pct(n, total) {
  if (!total) return "0%";
  return (100 * n / total).toFixed(1) + "%";
}

function downloadCsv(cohort, prefix) {
  const rows = ["courier_id", ...cohort.courier_ids.map(String)];
  const blob = new Blob([rows.join("\n") + "\n"], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${prefix}_${cohort.id}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function metaCard(grid, label, value, small) {
  const el = document.createElement("div");
  el.className = "meta";
  el.innerHTML = `<div class="label">${label}</div><div class="value${small ? " sm" : ""}">${value}</div>`;
  grid.appendChild(el);
}

if (SC) {
  const cm = SC.meta;
  document.getElementById("campaign-subtitle").textContent =
    `${cm.purpose} · pool of ${cm.pool_size.toLocaleString()} couriers · ${cm.period_label}`;

  const cGrid = document.getElementById("campaign-meta-grid");
  metaCard(cGrid, "Pool (all Kyiv)", cm.pool_size.toLocaleString());
  metaCard(cGrid, "By Sunday DO peak hour", (cm.sunday_peak_hour_assigned || 0).toLocaleString());
  metaCard(cGrid, "No Sunday DO history", (cm.no_sunday_history_balanced || 0).toLocaleString());
  metaCard(cGrid, "Rule", "peak hour → slot", true);

  const campRoot = document.getElementById("campaign-cohorts");
  const campById = Object.fromEntries(SC.campaigns.map(c => [c.id, c]));

  SC.campaign_order.forEach(id => {
    const c = campById[id];
    if (!c) return;
    const s = c.summary;
    const card = document.createElement("article");
    card.className = "cohort campaign";
    card.innerHTML = `
      <div class="cohort-head">
        <h3>${c.title}</h3>
        <span class="count">${c.time_label} · ${c.count.toLocaleString()}</span>
      </div>
      <p class="desc">${c.description}</p>
      <div class="windows">
        <div><strong>From weekend cohorts:</strong>
          regular_both ${s.from_regular_both} · regular_sunday ${s.from_regular_sunday} ·
          no_weekend ${s.from_no_weekend}
        </div>
        <div style="margin-top:4px"><strong>Assignment:</strong>
          Sunday peak hour ${s.sunday_peak_hour_assigned} · balanced (no Sunday DO) ${s.no_sunday_history_balanced}
        </div>
      </div>
      <div class="actions">
        <button class="btn" type="button">Download courier_id (.csv)</button>
      </div>
    `;
    card.querySelector(".btn").addEventListener("click", () => downloadCsv(c, "kyiv_sunday"));
    campRoot.appendChild(card);
  });

  document.getElementById("campaign-footnote").textContent =
    `${cm.pool_definition} ${cm.assignment_rule}`;
}

document.getElementById("subtitle").textContent =
  `${meta.city} · ${meta.period_label} · ${meta.total_couriers.toLocaleString()} active couriers from W23 CSV · ` +
  `4 Saturdays (${meta.weekend_saturdays.join(", ")}) · 4 Sundays (${meta.weekend_sundays.join(", ")})`;

const wGrid = document.getElementById("meta-grid");
metaCard(wGrid, "Couriers in sample", meta.total_couriers.toLocaleString());
metaCard(wGrid, "“Regular” threshold", `≥${meta.regular_threshold_weeks} of 4 weekends`);
metaCard(wGrid, "Online / DO source", "fact_courier_daily_v2");
metaCard(wGrid, "Delivery hour source", "fact_order_delivery · HOUR(order_created_at_local)", true);

const byId = Object.fromEntries(cohorts.map(c => [c.id, c]));
const root = document.getElementById("cohorts");

cohort_order.forEach(id => {
  const c = byId[id];
  if (!c) return;
  const s = c.summary;
  const card = document.createElement("article");
  card.className = "cohort";
  card.innerHTML = `
    <div class="cohort-head">
      <h3>${c.title}</h3>
      <span class="count">${c.count.toLocaleString()} · ${pct(c.count, meta.total_couriers)}</span>
    </div>
    <p class="desc">${c.description}</p>
    <div class="metrics">
      <div class="metric">
        <div class="k">Sat · online h (avg)</div>
        <div class="v">${s.avg_sat_online_hours}</div>
      </div>
      <div class="metric">
        <div class="k">Sun · online h (avg)</div>
        <div class="v">${s.avg_sun_online_hours}</div>
      </div>
      <div class="metric">
        <div class="k">Sat · DO (avg)</div>
        <div class="v">${s.avg_sat_delivered_orders}</div>
      </div>
      <div class="metric">
        <div class="k">Sun · DO (avg)</div>
        <div class="v">${s.avg_sun_delivered_orders}</div>
      </div>
    </div>
    <div class="windows">
      <div><strong>Saturday deliveries:</strong> ${s.with_sat_deliveries.toLocaleString()} couriers${
        s.typical_sat_delivery_window
          ? ` · typical windows: ${s.typical_sat_delivery_window}`
          : ""
      }</div>
      <div style="margin-top:4px"><strong>Sunday deliveries:</strong> ${s.with_sun_deliveries.toLocaleString()} couriers${
        s.typical_sun_delivery_window
          ? ` · typical windows: ${s.typical_sun_delivery_window}`
          : ""
      }</div>
    </div>
    <div class="actions">
      <button class="btn" type="button">Download courier_id (.csv)</button>
    </div>
  `;
  card.querySelector(".btn").addEventListener("click", () => downloadCsv(c, "kyiv_weekend"));
  root.appendChild(card);
});

document.getElementById("footnote").textContent =
  `${meta.active_definition} ${meta.delivery_window_note}`;
</script>
</body>
</html>
